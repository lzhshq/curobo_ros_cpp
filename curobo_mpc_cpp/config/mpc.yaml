curobo_mpc:
  ros__parameters:
    artifact_dir: ""
    trajectory_dt: 0.03
    planner_distance_threshold: 0.15
    far_replan_period: 1.0
    far_replan_min_move: 0.01
    control_rate: 30.0
    command_interval: 0.48
    state_timeout: 0.2
    max_tracking_error: 0.05
    brake_check: true
    brake_deceleration: 2.0
    fault_topic: /curobo_mpc/fault
    bat_topic: /curobo_demo/bat_pose
    bat_length: 0.4
    bat_radius: 0.03
    bat_initial_x: 0.30
    bat_initial_y: 0.0
    bat_initial_z: 0.30
    adapter: jtc
    publish_rate: 100.0
    command_topic: /position_forward_controller/commands
    joint_states_topic: /joint_states
    goal_topic: /curobo_mpc/goal
