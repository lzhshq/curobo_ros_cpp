curobo_planner:
  ros__parameters:
    # Option 1: absolute artifact directory.
    # Example:
    #   artifact_dir: /home/vitai/curobo-fast/cpp_runtime/robot/artifacts/tickbot
    artifact_dir: ""

    # Option 2: resolve artifact_root/<robot>; ignored when artifact_dir is set.
    # Example:
    #   artifact_root: /home/vitai/curobo-fast/cpp_runtime/robot/artifacts
    #   robot: tickbot
    artifact_root: ""
    robot: ""

    # Empty means the first tool frame in the artifact.
    tool_frame: ""
    base_frame: ""

    max_attempts: 10
    enable_graph_attempt: 1
    outer_iterations: 2

    scene_max_cuboids: 8
    scene_max_capsules: 8
    scene_max_cylinders: 8
    scene_max_meshes: 0
    scene_max_voxel_grids: 0
    scene_max_voxels_per_grid: 0

    joint_states_topic: /joint_states
    publish_trajectory: true
    publish_path: true
    path_marker_radius: 0.006
    publish_scene_markers: true
